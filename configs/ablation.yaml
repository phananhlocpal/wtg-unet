base_config: configs/fives.yaml

variants:
  - name: unet_region
    overrides:
      model:
        use_residual: false
        use_wtg: false
      loss:
        use_centerline: false
        use_radius: false
        use_topology: false
  - name: residual_region
    overrides:
      model:
        use_residual: true
        use_wtg: false
      loss:
        use_centerline: false
        use_radius: false
        use_topology: false
  - name: wtg_centerline
    overrides:
      model:
        use_residual: true
        use_wtg: true
