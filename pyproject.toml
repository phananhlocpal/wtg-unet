[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wtg-unet-repro"
version = "0.1.0"
description = "Reproducible WTG-U-Net retinal vessel segmentation experiment"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-image>=0.22",
  "opencv-python-headless>=4.8",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "matplotlib>=3.8",
  "torch>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

